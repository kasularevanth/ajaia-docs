# Render Blueprint — deploys both services from this repo (free tier).
# Docs: https://render.com/docs/blueprint-spec
services:
  # ---------- API: Express + Drizzle (Render Web Service, free) ----------
  - type: web
    name: ajaia-docs-api
    runtime: node
    plan: free
    region: oregon
    branch: main
    # Render sets NODE_ENV=production; --include=dev keeps build tools (tsup, typescript) available.
    buildCommand: npm ci --include=dev && npm run build -w @ajaia/api
    startCommand: npm run start -w @ajaia/api
    healthCheckPath: /api/health
    autoDeploy: true
    buildFilter:
      paths:
        - apps/api/**
        - packages/shared/**
        - package-lock.json
        - render.yaml
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false # Neon pooled connection string — paste in the Render dashboard, never commit
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGINS
        value: https://ajaia-docs-web-9lts.onrender.com
      - key: MAX_UPLOAD_MB
        value: "5"
      - key: SEED_DEMO_DATA
        value: "true"
      - key: DEMO_PASSWORD
        value: demo1234
      - key: BCRYPT_ROUNDS
        value: "10"
      - key: LOG_LEVEL
        value: info

  # ---------- Web: React SPA (Render Static Site, free) ----------
  - type: web
    name: ajaia-docs-web
    runtime: static
    branch: main
    buildCommand: npm ci --include=dev && npm run build -w @ajaia/web
    staticPublishPath: apps/web/dist
    autoDeploy: true
    buildFilter:
      paths:
        - apps/web/**
        - packages/shared/**
        - package-lock.json
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Public, not a secret. Also committed in apps/web/.env.production.
      - key: VITE_API_URL
        value: https://ajaia-docs-api-h888.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
